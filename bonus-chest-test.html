<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonus chest — test</title>
<style>
html,body{margin:0;height:100%;background:#120a22;color:#ffe7bb;font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:0;right:0;bottom:22px;display:flex;gap:14px;justify-content:center}
button{font:700 18px/1 inherit;letter-spacing:.12em;padding:14px 30px;border-radius:12px;border:2px solid #ffc457;background:linear-gradient(#5a2a8a,#2a1048);color:#fff0b0;cursor:pointer}
button:hover:not(:disabled){filter:brightness(1.25)}button:disabled{opacity:.45;cursor:default}
#info{position:fixed;left:16px;top:12px;font-size:14px;letter-spacing:.08em;line-height:1.6;opacity:.9}
#prize{position:fixed;left:50%;top:9%;transform:translateX(-50%) scale(.6);opacity:0;font:900 56px Georgia,serif;color:#fff3c4;-webkit-text-stroke:5px #7a2608;paint-order:stroke fill;text-shadow:0 6px 0 #8e2a06,0 0 40px #ffb02a;transition:all .6s cubic-bezier(.2,1.5,.4,1);pointer-events:none}
#prize.on{opacity:1;transform:translateX(-50%) scale(1)}
</style></head><body>
<canvas id="c"></canvas>
<div id="info">BONUS CHEST · TEST PAGE<br><span id="state">closed</span> · lid <span id="angle">0</span>° · drag to orbit<br><small>Revealed value is a fixed TEST value passed in from outside — the chest never decides a prize.</small></div>
<div id="prize"></div>
<div id="ui"><button id="open">APRI</button><button id="close">CHIUDI</button><button id="reset">RESET</button></div>
<script type="module" src="/src/bonus-chest/chest-test.ts"></script></body></html>
